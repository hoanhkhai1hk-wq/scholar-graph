# Optional, separate service. Does not enable enrichment in the HTTP upload factory.
# Official CRF CPU image; full-text/header/reference outputs are measured by the probe.
services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:8070:8070"
    ulimits:
      core: 0
    mem_limit: 6g
    restart: "no"
