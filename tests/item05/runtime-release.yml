# Apply after the existing deployment config; data mounts and credentials stay local.
services:
  backend:
    image: scholar-graph-backend:item05-20261029
    restart: unless-stopped
  frontend:
    image: scholar-graph-frontend:item05-20261029
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/workspace/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 15
