services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        SCHOLAR_GRAPH_REVISION: ${SCHOLAR_GRAPH_REVISION:-unknown}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SCHOLAR_GRAPH_DATA_DIR: /app/data/records
      SCHOLAR_GRAPH_QA_MODE: extractive
      SCHOLAR_GRAPH_OCR_CACHE_DIR: /app/data/paddle-models
      SCHOLAR_GRAPH_RETRIEVAL_MODE: bge_m3_hybrid
      SCHOLAR_GRAPH_QA_RETRIEVAL_MODE: hybrid
      SCHOLAR_GRAPH_TRACKING_ENABLED: "true"
      SCHOLAR_GRAPH_TRACKING_INTERVAL_SECONDS: "86400"
      SCHOLAR_GRAPH_TRACKING_INITIAL_DELAY_SECONDS: "15"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/api/v1/papers?page_size=1', timeout=10).status == 200"]
      interval: 15s
      timeout: 12s
      start_period: 30s
      retries: 8

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        SCHOLAR_GRAPH_REVISION: ${SCHOLAR_GRAPH_REVISION:-unknown}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/backend/papers?page_size=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 12s
      start_period: 30s
      retries: 8

volumes:
  backend-data:
