# Copy to docker-compose.override.yml only when it does not already exist.
# Keep real credentials in the ignored local .env; never replace refs with values.
services:
  backend:
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SCHOLAR_GRAPH_QA_MODE: deepseek
      SCHOLAR_GRAPH_WORKSPACE_RETRIEVAL: ${SCHOLAR_GRAPH_WORKSPACE_RETRIEVAL:-lexical}
